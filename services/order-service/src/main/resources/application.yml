server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4

app:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_TOKEN}
  catalog-url: ${CATALOG_URL:http://localhost:8082}
  mail-from: ${MAIL_FROM:PGMart <no-reply@pgmart.local>}
  store-url: ${STORE_URL:http://localhost:8080}
  razorpay:
    # Empty = online payment off, Cash on Delivery only
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
