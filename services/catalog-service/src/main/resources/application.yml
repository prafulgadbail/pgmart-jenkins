server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogdb}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:catalog_svc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
